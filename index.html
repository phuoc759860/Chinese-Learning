<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK3 Luyện tập Viết & Đọc | Writing & Reading Practice</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand" id="brandBtn">
      <div class="seal">写</div>
      <div>
        <h1>HSK3 Luyện tập</h1>
        <small>Nền tảng luyện tập HSK3 · Viết 71–80 & Đọc hiểu 41–70</small>
      </div>
    </div>
    <div class="topbar-spacer"></div>
    <div class="topbar-stats" id="globalStats"></div>
  </div>
</header>

<main id="view"></main>

<footer>Nguồn: 20 đề thi thật HSK3 · Phần viết (Sắp xếp câu 71–75 / Điền chữ Hán 76–80) · Phần đọc hiểu (41–70)</footer>

<script src="data.js"></script>
<script>
"use strict";

const LS_KEY = "hsk3writing_progress_v1";
const state = {
  currentExam: null,
  currentPart: 1,          // 1 = reorder (71-75), 2 = fill blank (76-80), 3 = reading (41-70)
  part1Index: 0,
  part1Order: [],          // selected chunk indices in order
  part1Shuffled: [],
  part1Saved: {},          // q -> { order, shuffled } so back button restores work
  part2Index: 0,
  part2Answers: {},        // q -> typed character
  feedback: null,
  results: {},             // examNum -> { part1: {q:bool}, part2: {q:bool}, total, correct }
  reading: { part: 1, index: 0, answers: {}, checked: {} },
};

/* ---------------- persistence ---------------- */
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveProgress(progress) {
  localStorage.setItem(LS_KEY, JSON.stringify(progress));
}

function getExamStats(examNum) {
  const p = loadProgress();
  const e = p[String(examNum)] || {};
  const w = { correct: (e.p1 || 0) + (e.p2 || 0), total: 10 };
  const r = e.read || {};
  const rc = (r.p1 || 0) + (r.p2 || 0) + (r.p3 || 0) + (r.p4 || 0) + (r.p5 || 0);
  return { correct: w.correct + rc, total: 40, w: w.correct, r: rc, p1: e.p1 || 0, p2: e.p2 || 0 };
}

function recordResult(examNum, part, q, isCorrect) {
  const p = loadProgress();
  const key = String(examNum);
  const e = p[key] || {};
  const qKey = "q" + q;
  if (part === 1) {
    e.p1map = e.p1map || {};
    if (!e.p1map[qKey]) e.p1map[qKey] = isCorrect;
    e.p1 = Object.values(e.p1map).filter(Boolean).length;
  } else {
    e.p2map = e.p2map || {};
    if (!e.p2map[qKey]) e.p2map[qKey] = isCorrect;
    e.p2 = Object.values(e.p2map).filter(Boolean).length;
  }
  p[key] = e;
  saveProgress(p);
}

function recordReading(examNum, part, q, isCorrect) {
  const p = loadProgress();
  const key = String(examNum);
  const e = p[key] || {};
  e.readmap = e.readmap || {};
  const qk = "p" + part + "_q" + q;
  if (e.readmap[qk] === undefined) e.readmap[qk] = isCorrect;
  const c = { p1: 0, p2: 0, p3: 0, p4: 0, p5: 0 };
  for (const k of Object.keys(e.readmap)) {
    const m = k.match(/^p(\d)_q/);
    if (m && e.readmap[k]) c["p" + m[1]]++;
  }
  e.read = c;
  p[key] = e;
  saveProgress(p);
}

/* ---------------- helpers ---------------- */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function stripPunct(s) {
  return s.replace(/[。！？，、；：""''—…\s]/g, "");
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

const LI = s => "ABCDEF".indexOf(s);

const thudAudio = (function () {
  try { return new Audio("SE/thud.mp3"); }
  catch (e) { return null; }
})();
function playWrong() {
  try {
    if (!thudAudio) return;
    thudAudio.currentTime = 0;
    thudAudio.play();
  } catch (e) {}
}

/* ---------------- rendering ---------------- */
const view = document.getElementById("view");
const globalStats = document.getElementById("globalStats");

function renderGlobalStats() {
  const p = loadProgress();
  let done = 0;
  for (const k of Object.keys(p)) if ((p[k].p1 || 0) + (p[k].p2 || 0) >= 10) done++;
  globalStats.innerHTML = "Đã hoàn thành <b>" + done + "</b> / 20 đề";
}

function renderHome() {
  state.currentExam = null;
  renderGlobalStats();
  let cards = "";
  for (const ex of EXAM_DATA) {
    const s = getExamStats(ex.num);
    const pct = Math.round((s.correct / s.total) * 100);
    const tag = s.correct === 0 ? ' <span class="tag">Chưa bắt đầu</span>'
              : s.correct === 40 ? ' <span class="tag">Đã nắm vững</span>'
              : ' <span class="tag">Đang luyện</span>';
    cards += `
      <div class="exam-card" data-exam="${ex.num}">
        <div class="num">ĐỀ ${ex.num}</div>
        <div class="code">${ex.code} · Viết + Đọc</div>
        ${tag}
        <div class="progress">
          <span>Viết ${s.w}/10</span>
          <span>Đọc ${s.r}/30</span>
        </div>
        <div class="bar"><span style="width:${pct}%"></span></div>
      </div>`;
  }
  view.innerHTML = `
    <div class="page-title">
      <h2>Luyện tập HSK3 · 20 đề thi thật</h2>
      <p>Phần viết (Sắp xếp câu 71–75 / Điền chữ Hán 76–80) · Phần đọc hiểu (Chọn câu đúng 41–50 / Chọn từ 51–60 / Đọc hiểu 61–70)</p>
    </div>
    <div class="exam-grid">${cards}</div>`;

  view.querySelectorAll(".exam-card").forEach(card => {
    card.addEventListener("click", () => {
      const n = parseInt(card.dataset.exam, 10);
      const ex = EXAM_DATA.find(e => e.num === n);
      if (ex) startExam(ex);
    });
  });
}

function startExam(ex) {
  state.currentExam = ex;
  state.currentPart = 1;
  state.results = { part1: {}, part2: {} };
  state.part1Index = 0;
  state.part2Index = 0;
  state.part1Order = [];
  state.part1Shuffled = [];
  state.part1Saved = {};
  state.part2Answers = {};
  state.feedback = null;
  state.reading = { part: 1, index: 0, answers: {}, checked: {} };
  renderExam();
}

function renderExam() {
  const ex = state.currentExam;
  if (!ex) { renderHome(); return; }
  const s = getExamStats(ex.num);
  const pct = Math.round((s.correct / s.total) * 100);

  const tabs = `
    <div class="tabs">
      <button class="tab ${state.currentPart === 1 ? "active" : ""}" data-part="1">Sắp xếp câu <small>Câu 71–75</small></button>
      <button class="tab ${state.currentPart === 2 ? "active" : ""}" data-part="2">Điền chữ Hán <small>Câu 76–80</small></button>
      <button class="tab ${state.currentPart === 3 ? "active" : ""}" data-part="3">Đọc hiểu <small>Câu 41–70</small></button>
    </div>`;

  view.innerHTML = `
    <div class="exam-head">
      <button class="back-btn" id="backBtn">← Về danh sách đề</button>
      <div>
        <div class="title">ĐỀ ${ex.num} · ${ex.code}</div>
        <div class="sub">Viết ${s.w}/10 · Đọc ${s.r}/30 · Tổng ${s.correct}/${s.total} câu đúng</div>
      </div>
      <div class="score-pill ${pct === 100 ? "good" : ""}">${pct}%</div>
    </div>
    ${tabs}
    <div id="partBody"></div>`;

  document.getElementById("backBtn").addEventListener("click", renderHome);
  view.querySelectorAll(".tab").forEach(t => {
    t.addEventListener("click", () => {
      state.currentPart = parseInt(t.dataset.part, 10);
      renderExam();
    });
  });

  if (state.currentPart === 1) renderPart1(ex);
  else if (state.currentPart === 2) renderPart2(ex);
  else renderReading(ex);
}

/* ================= Part 1: reorder ================= */
function savePart1Current(item) {
  state.part1Saved[item.q] = {
    order: (state.part1Order || []).slice(),
    shuffled: (state.part1Shuffled || []).slice()
  };
}

function renderPart1(ex) {
  const items = ex.part1;
  const idx = state.part1Index = Math.min(state.part1Index, items.length - 1);
  const body = document.getElementById("partBody");
  body.innerHTML = `<div id="p1card"></div>`;
  renderPart1Item(items[idx], idx, items.length);
}

function renderPart1Item(item, idx, total) {
  const card = document.getElementById("p1card");
  if (!card) return;

  const saved = state.part1Saved[item.q];
  if (saved) {
    state.part1Shuffled = saved.shuffled;
    state.part1Order = saved.order;
  } else if (!state.part1Shuffled || state.part1Shuffled.length === 0) {
    state.part1Shuffled = shuffle(item.chunks.map((_, i) => i));
    state.part1Order = [];
  }
  if (!state.part1Order) state.part1Order = [];
  if (!state.feedback) state.feedback = null;

  let chips = "";
  state.part1Shuffled.forEach(ci => {
    const used = state.part1Order.includes(ci);
    chips += `<span class="chip ${used ? "used" : ""}" data-ci="${ci}">${esc(item.chunks[ci])}</span>`;
  });

  let answerSlots = "";
  if (state.part1Order.length === 0) {
    answerSlots = `<span class="placeholder">Nhấn vào từ, sắp xếp đúng thứ tự để tạo thành câu</span>`;
  } else {
    answerSlots = state.part1Order.map(ci =>
      `<span class="slot" data-slot="${ci}">${esc(item.chunks[ci])}</span>`).join("");
  }

  let fb = "";
  if (state.feedback) {
    const cls = state.feedback.correct ? "correct" : "wrong";
    fb = `<div class="feedback show ${cls}">
            <b>${state.feedback.correct ? "✓ Đúng rồi!" : "✗ Chưa đúng"}</b>
            <div class="answer">Đáp án đúng: ${esc(item.answer)}</div>
            <div class="explain">💡 Giải thích: ${esc(item.exp)}</div>
          </div>`;
  }

  card.innerHTML = `
    <div class="q-card">
      <div class="q-head">
        <div class="q-num">${item.q}</div>
        <div class="q-label">Câu ${idx + 1} / ${total} · Sắp xếp các từ thành một câu đúng</div>
      </div>
      <div class="chips">${chips}</div>
      <div class="answer-box">${answerSlots}</div>
      <div class="controls">
        ${idx > 0 ? `<button class="btn btn-ghost" id="prev1">← Câu trước</button>` : ""}
        <button class="btn btn-primary" id="check1" ${state.part1Order.length ? "" : "disabled"}>Kiểm tra</button>
        <button class="btn btn-ghost" id="showAns1">Xem đáp án</button>
        <button class="btn btn-ghost" id="clear1">Xóa</button>
        ${idx < total - 1
          ? `<button class="btn btn-primary" id="next1">Câu tiếp theo →</button>`
          : `<button class="btn btn-primary" id="finish1">Hoàn thành ✓</button>`}
      </div>
      ${fb}
    </div>`;

  card.querySelectorAll(".chip").forEach(ch => {
    ch.addEventListener("click", () => {
      const ci = parseInt(ch.dataset.ci, 10);
      if (state.part1Order.includes(ci)) return;
      state.part1Order.push(ci);
      state.feedback = null;
      renderPart1Item(item, idx, total);
    });
  });
  card.querySelectorAll(".slot").forEach(sl => {
    sl.addEventListener("click", () => {
      const ci = parseInt(sl.dataset.slot, 10);
      state.part1Order = state.part1Order.filter(c => c !== ci);
      state.feedback = null;
      renderPart1Item(item, idx, total);
    });
  });

  const prev = document.getElementById("prev1");
  if (prev) prev.addEventListener("click", () => {
    savePart1Current(item);
    state.part1Index--;
    state.part1Shuffled = [];
    state.part1Order = [];
    state.feedback = null;
    renderPart1(state.currentExam);
  });

  const check = document.getElementById("check1");
  if (check) check.addEventListener("click", () => {
    const built = state.part1Order.map(ci => item.chunks[ci]).join("");
    const ok = stripPunct(built) === stripPunct(item.answer);
    state.feedback = { correct: ok };
    if (!ok) playWrong();
    recordResult(state.currentExam.num, 1, item.q, ok);
    state.results.part1[item.q] = ok;
    renderPart1Item(item, idx, total);
  });

  const showAns = document.getElementById("showAns1");
  if (showAns) showAns.addEventListener("click", () => {
    state.feedback = { correct: false };
    playWrong();
    renderPart1Item(item, idx, total);
  });

  const clear = document.getElementById("clear1");
  if (clear) clear.addEventListener("click", () => {
    state.part1Order = [];
    state.feedback = null;
    delete state.part1Saved[item.q];
    renderPart1Item(item, idx, total);
  });

  const next = document.getElementById("next1");
  if (next) next.addEventListener("click", () => {
    savePart1Current(item);
    state.part1Index++;
    state.part1Shuffled = [];
    state.part1Order = [];
    state.feedback = null;
    renderPart1(state.currentExam);
  });

  const finish = document.getElementById("finish1");
  if (finish) finish.addEventListener("click", () => {
    state.currentPart = 2;
    state.part1Index = 0;
    state.part1Shuffled = [];
    state.part1Order = [];
    state.feedback = null;
    renderExam();
  });
}

/* ================= Part 2: fill blank ================= */
function renderPart2(ex) {
  const idx = state.part2Index = Math.min(state.part2Index, ex.part2.length - 1);
  const body = document.getElementById("partBody");
  body.innerHTML = `<div id="p2card"></div>`;
  renderPart2Item(ex.part2[idx], idx, ex.part2.length);
}

function renderPart2Item(item, idx, total) {
  const card = document.getElementById("p2card");
  if (!card) return;

  const typed = state.part2Answers[item.q] || "";
  const answered = typed !== "";
  const got = answered && typed.trim() === item.answer;

  const [before, after] = item.sentence.split("〔〕");
  const blankCls = answered ? (got ? "blank done" : "blank filled") : "blank";
  const blankTxt = answered ? esc(typed) : "";

  let fb = "";
  if (answered && !got) {
    fb = `<div class="feedback show wrong">
            <b>✗ Chưa đúng</b>
            <div class="answer">Đáp án đúng: ${esc(item.answer)}</div>
            <div class="explain">💡 Giải thích: ${esc(item.exp)}</div>
          </div>`;
  } else if (answered && got) {
    fb = `<div class="feedback show correct"><b>✓ Đúng rồi!</b> <span class="explain-inline">${esc(item.exp)}</span></div>`;
  }

  card.innerHTML = `
    <div class="q-card">
      <div class="q-head">
        <div class="q-num">${item.q}</div>
        <div class="q-label">Câu ${idx + 1} / ${total} · Điền chữ Hán đúng theo phiên âm</div>
      </div>
      <div class="pinyin-hint">🔈 ${esc(item.pinyin)}</div>
      <div class="sentence">
        <span>${esc(before)}</span><span class="${blankCls}">${blankTxt}</span><span>${esc(after)}</span>
      </div>
      <div class="controls">
        ${idx > 0 ? `<button class="btn btn-ghost" id="prev2">← Câu trước</button>` : ""}
        <input class="char-input" id="charInput" maxlength="2" placeholder="Chữ Hán"
               value="${esc(typed)}" ${answered ? "disabled" : ""}>
        <button class="btn btn-primary" id="confirm2" ${answered ? "disabled" : ""}>Xác nhận</button>
        <button class="btn btn-ghost" id="showAns2" ${answered ? "disabled" : ""}>Xem đáp án</button>
        <button class="btn btn-ghost" id="reset2">Làm lại</button>
        ${idx < total - 1
          ? `<button class="btn btn-primary" id="next2">Câu tiếp theo →</button>`
          : `<button class="btn btn-primary" id="finish2">Hoàn thành ✓</button>`}
      </div>
      ${fb}
    </div>`;

  const input = document.getElementById("charInput");
  if (input && !answered) {
    input.focus();
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") confirm();
    });
  }

  const confirm = () => {
    const v = input.value.trim();
    if (!v) return;
    state.part2Answers[item.q] = v;
    const ok = v === item.answer;
    if (!ok) playWrong();
    recordResult(state.currentExam.num, 2, item.q, ok);
    state.results.part2[item.q] = ok;
    renderPart2Item(item, idx, total);
  };

  const prev = document.getElementById("prev2");
  if (prev) prev.addEventListener("click", () => {
    state.part2Index--;
    renderPart2(state.currentExam);
  });

  const confirmBtn = document.getElementById("confirm2");
  if (confirmBtn) confirmBtn.addEventListener("click", confirm);

  const showAns = document.getElementById("showAns2");
  if (showAns) showAns.addEventListener("click", () => {
    state.part2Answers[item.q] = item.answer;
    recordResult(state.currentExam.num, 2, item.q, false);
    playWrong();
    renderPart2Item(item, idx, total);
  });

  const reset = document.getElementById("reset2");
  if (reset) reset.addEventListener("click", () => {
    delete state.part2Answers[item.q];
    renderPart2Item(item, idx, total);
  });

  const next = document.getElementById("next2");
  if (next) next.addEventListener("click", () => {
    state.part2Index++;
    renderPart2(state.currentExam);
  });

  const finish = document.getElementById("finish2");
  if (finish) finish.addEventListener("click", () => {
    renderResult();
  });
}

/* ================= Reading (41-70) ================= */
function renderReading(ex) {
  const rd = state.reading;
  const body = document.getElementById("partBody");
  const subtabs = `
    <div class="subtabs">
      <button class="subtab ${rd.part === 1 ? "active" : ""}" data-rp="1">P1 · Chọn câu đúng <small>41–45</small></button>
      <button class="subtab ${rd.part === 2 ? "active" : ""}" data-rp="2">P2 · Chọn câu đúng <small>46–50</small></button>
      <button class="subtab ${rd.part === 3 ? "active" : ""}" data-rp="3">P3 · Chọn từ <small>51–55</small></button>
      <button class="subtab ${rd.part === 4 ? "active" : ""}" data-rp="4">P4 · Chọn từ <small>56–60</small></button>
      <button class="subtab ${rd.part === 5 ? "active" : ""}" data-rp="5">P5 · Đọc hiểu <small>61–70</small></button>
    </div>`;
  body.innerHTML = subtabs + `<div id="readcard"></div>`;
  body.querySelectorAll(".subtab").forEach(b => {
    b.addEventListener("click", () => {
      rd.part = parseInt(b.dataset.rp, 10);
      rd.index = 0;
      renderReading(ex);
    });
  });
  renderReadingItem(ex);
}

function renderReadingItem(ex) {
  const rd = state.reading;
  const card = document.getElementById("readcard");
  if (!card) return;

  const part = ex.reading["p" + rd.part];
  const total = part.items.length;
  const idx = Math.min(rd.index, total - 1);
  rd.index = idx;
  const item = part.items[idx];
  const sel = rd.answers[item.q];
  const chk = rd.checked[item.q];

  const opts = rd.part === 5 ? item.opts : part.options;
  let label;
  if (rd.part === 5) label = "Đọc đoạn văn và chọn đáp án đúng";
  else if (rd.part >= 3) label = "Chọn từ đúng điền vào chỗ trống";
  else label = "Chọn câu có nghĩa hợp với câu đã cho";

  let optionsHtml = `<div class="options-grid">` + opts.map((o, i) => {
    const L = "ABCDEF"[i];
    const cls = "opt-btn" + (sel === L ? " sel" : "");
    return `<button class="${cls}" data-letter="${L}" ${chk !== undefined ? "disabled" : ""}><b>${L}.</b><span>${esc(o)}</span></button>`;
  }).join("") + `</div>`;

  let bodyHtml = "";
  if (rd.part >= 3 && rd.part <= 4) {
    const word = sel ? opts[LI(sel)] : "";
    const filled = word
      ? item.text.replace("（　）", `<span class="blank done">${esc(word)}</span>`)
      : item.text.replace("（　）", `<span class="blank"></span>`);
    bodyHtml = optionsHtml + `<div class="read-sentence">${filled}</div>`;
  } else if (rd.part === 5) {
    bodyHtml = `<div class="passage">${esc(item.passage)}</div>
                <div class="read-qtext">★ ${esc(item.question)}</div>` + optionsHtml;
  } else {
    bodyHtml = `<div class="read-qtext">${esc(item.text)}</div>` + optionsHtml;
  }

  let fb = "";
  if (chk !== undefined) {
    const ok = chk;
    const ansText = rd.part === 5 ? item.opts[LI(item.a)] : opts[LI(item.a)];
    fb = `<div class="feedback show ${ok ? "correct" : "wrong"}">
            <b>${ok ? "✓ Đúng rồi!" : "✗ Chưa đúng"}</b>
            <div class="answer">Đáp án đúng: ${item.a}. ${esc(ansText)}</div>
            <div class="explain">💡 Giải thích: ${esc(item.exp)}</div>
          </div>`;
  }

  card.innerHTML = `
    <div class="q-card">
      <div class="q-head">
        <div class="q-num">${item.q}</div>
        <div class="q-label">Phần ${rd.part} · Câu ${idx + 1} / ${total} · ${label}</div>
      </div>
      ${bodyHtml}
      <div class="controls">
        <button class="btn btn-ghost" id="rprev" ${idx > 0 ? "" : "disabled"}>← Câu trước</button>
        <button class="btn btn-primary" id="rcheck" ${sel && chk === undefined ? "" : "disabled"}>Kiểm tra</button>
        <button class="btn btn-ghost" id="rshow" ${chk === undefined ? "" : "disabled"}>Xem đáp án</button>
        <button class="btn btn-ghost" id="rclear">Xóa chọn</button>
        ${idx < total - 1
          ? `<button class="btn btn-primary" id="rnext">Câu tiếp theo →</button>`
          : `<button class="btn btn-primary" id="rfinish">Hoàn thành ✓</button>`}
      </div>
      ${fb}
    </div>`;

  card.querySelectorAll(".opt-btn").forEach(b => {
    b.addEventListener("click", () => {
      const L = b.dataset.letter;
      if (state.reading.answers[item.q] === L) delete state.reading.answers[item.q];
      else state.reading.answers[item.q] = L;
      delete state.reading.checked[item.q];
      renderReadingItem(ex);
    });
  });

  const rprev = document.getElementById("rprev");
  if (rprev) rprev.addEventListener("click", () => {
    rd.index = Math.max(0, idx - 1);
    renderReadingItem(ex);
  });

  const rcheck = document.getElementById("rcheck");
  if (rcheck) rcheck.addEventListener("click", () => {
    const ok = sel === item.a;
    rd.checked[item.q] = ok;
    if (!ok) playWrong();
    recordReading(ex.num, rd.part, item.q, ok);
    renderReadingItem(ex);
  });

  const rshow = document.getElementById("rshow");
  if (rshow) rshow.addEventListener("click", () => {
    rd.answers[item.q] = item.a;
    rd.checked[item.q] = false;
    recordReading(ex.num, rd.part, item.q, false);
    playWrong();
    renderReadingItem(ex);
  });

  const rclear = document.getElementById("rclear");
  if (rclear) rclear.addEventListener("click", () => {
    delete rd.answers[item.q];
    delete rd.checked[item.q];
    renderReadingItem(ex);
  });

  const rnext = document.getElementById("rnext");
  if (rnext) rnext.addEventListener("click", () => {
    rd.index = Math.min(total - 1, idx + 1);
    renderReadingItem(ex);
  });

  const rfinish = document.getElementById("rfinish");
  if (rfinish) rfinish.addEventListener("click", () => {
    renderResult();
  });
}

/* ================= Result ================= */
function renderResult() {
  const ex = state.currentExam;
  const s = getExamStats(ex.num);
  const pct = Math.round((s.correct / s.total) * 100);
  view.innerHTML = `
    <div class="exam-head">
      <button class="back-btn" id="backBtn">← Về danh sách đề</button>
      <div>
        <div class="title">ĐỀ ${ex.num} · ${ex.code} Hoàn thành</div>
        <div class="sub">Đã kết thúc phần luyện tập</div>
      </div>
    </div>
    <div class="result ${pct === 100 ? "good" : ""}">
      <div class="big-score">${s.correct} / ${s.total}</div>
      <h3>${pct === 100 ? "Tuyệt vời! Đúng hết 🎉" : pct >= 70 ? "Rất tốt, cố lên nhé!" : "Luyện thêm vài lần sẽ tốt hơn"}</h3>
      <p>Tỷ lệ đúng ${pct}% · Phần viết ${s.w}/10 · Phần đọc ${s.r}/30</p>
      <div class="row-again">
        <button class="btn btn-primary" id="retry">Luyện lại</button>
        <button class="btn btn-ghost" id="backHome">Về danh sách đề</button>
      </div>
    </div>`;

  document.getElementById("backBtn").addEventListener("click", renderHome);
  document.getElementById("backHome").addEventListener("click", renderHome);
  document.getElementById("retry").addEventListener("click", () => startExam(ex));
}

/* ---------------- init ---------------- */
document.getElementById("brandBtn").addEventListener("click", renderHome);
renderHome();
</script>
